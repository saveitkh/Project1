# VPS deployment: the Khmer AI Dubbing Studio (opened from the bot as a Mini App)
# behind automatic HTTPS. Telegram only opens https Mini Apps; the free sslip.io
# names below resolve to the VPS IP, so no domain has to be bought.
#
#   cp .env.studio.example .env.studio   # GEMINI_API_KEY, STUDIO_ADMIN_PASSWORD
#   docker compose up -d --build         # studio + https
#   docker compose --profile bot up -d --build   # ALSO run this bot here (see below)
#
# Then set DUBBING_STUDIO_URL=https://<STUDIO_HOST>/ wherever the bot runs.
services:
  studio:
    # Built straight from the studio's GitHub repo; set STUDIO_GIT_REF=main once merged
    build:
      context: https://github.com/saveitkh/BarameyDabber.git#${STUDIO_GIT_REF:-claude/affectionate-noether-yvzenh}
    container_name: dubbing-studio
    restart: unless-stopped
    env_file:
      - .env.studio
    environment:
      - PORT=3000
      - STUDIO_PUBLIC_MODE=1
      # Telegram auto-login: same bot token the bot uses (TELEGRAM_LOGIN_BOT_TOKEN in .env)
      - STUDIO_TELEGRAM_BOT_TOKEN=${TELEGRAM_LOGIN_BOT_TOKEN:-}
    volumes:
      - studio_data:/app/data
      - studio_uploads:/app/uploads
      - studio_outputs:/app/outputs
      - studio_samples:/app/samples
    expose:
      - "3000"

  # Khmer Sonic AI: a second Mini App (Khmer voice clone / lyrics / AI song),
  # built straight from its GitHub repo. One Node process serves the PWA + API.
  # Defaults to the mock engine, so it runs with no keys; add provider keys to
  # the VPS .env (ANTHROPIC_API_KEY, GEMINI_API_KEY, ...) and flip the
  # SONG_*_PROVIDER vars to go live.
  song:
    build:
      context: https://github.com/saveitkh/khmer-song-.git#${SONG_GIT_REF:-claude/khmer-song-ui-production-9z3b8b}
    container_name: khmer-sonic
    restart: unless-stopped
    environment:
      - PORT=3000
      - PUBLIC_URL=https://${SONG_HOST:?Set SONG_HOST, e.g. song.184-174-38-113.sslip.io}
      # Telegram Mini App auth: same bot token the bot logs people in with.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_LOGIN_BOT_TOKEN:-}
      # Set SONG_ALLOW_BROWSER_DEMO=on in .env to preview the app in a plain
      # browser (no Telegram) with mock data. Keep off for real production.
      - ALLOW_BROWSER_DEMO=${SONG_ALLOW_BROWSER_DEMO:-off}
      # Engines — all optional; default mock so it runs with zero keys.
      - VOICE_PROVIDER=${SONG_VOICE_PROVIDER:-mock}
      - LYRICS_PROVIDER=${SONG_LYRICS_PROVIDER:-mock}
      - MUSIC_PROVIDER=${SONG_MUSIC_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VOXCPM_WORKER_URL=${VOXCPM_WORKER_URL:-}
      - VOXCPM_WORKER_SECRET=${VOXCPM_WORKER_SECRET:-}
      - SUPABASE_URL=${SONG_SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SONG_SUPABASE_SERVICE_ROLE_KEY:-}
    expose:
      - "3000"

  # The bot/userbot service from this repo. Opt-in (--profile bot): run it here only if
  # it is NOT also running on Railway -- two copies of the userbot fight over the
  # Telegram session and the webhook.
  bot:
    profiles: ["bot"]
    build: .
    container_name: saveit-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - PUBLIC_URL=https://${BOT_HOST:-bot.localhost}
      - DUBBING_STUDIO_URL=https://${STUDIO_HOST:?Set STUDIO_HOST}/
    expose:
      - "8000"

  caddy:
    image: caddy:2
    container_name: vps-https
    restart: unless-stopped
    depends_on:
      - studio
      - song
    ports:
      - "80:80"
      - "443:443"
    environment:
      - STUDIO_HOST=${STUDIO_HOST:?Set STUDIO_HOST, e.g. dub.184-174-38-113.sslip.io}
      - SONG_HOST=${SONG_HOST:?Set SONG_HOST, e.g. song.184-174-38-113.sslip.io}
      - BOT_HOST=${BOT_HOST:-bot.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  studio_data:
  studio_uploads:
  studio_outputs:
  studio_samples:
  caddy_data:
  caddy_config:
