# VPS deployment: the Khmer AI Dubbing Studio (opened from the bot as a Mini App)
# behind automatic HTTPS. Telegram only opens https Mini Apps; the free sslip.io
# names below resolve to the VPS IP, so no domain has to be bought.
#
#   cp .env.studio.example .env.studio   # GEMINI_API_KEY, STUDIO_ADMIN_PASSWORD
#   docker compose up -d --build         # studio + VoxCPM2 voice cloning + https
#   (or just run scripts/deploy_vps.sh on the VPS)
#   docker compose --profile bot up -d --build   # ALSO run this bot here (see below)
#
# Then set DUBBING_STUDIO_URL=https://<STUDIO_HOST>/ wherever the bot runs.
services:
  studio:
    # Built straight from the studio's GitHub repo; set STUDIO_GIT_REF=main once merged
    build:
      context: https://github.com/saveitkh/BarameyDabber.git#${STUDIO_GIT_REF:-claude/admiring-curie-90hbte}
    container_name: dubbing-studio
    restart: unless-stopped
    env_file:
      - .env.studio
    environment:
      - PORT=3000
      - STUDIO_PUBLIC_MODE=1
      # Telegram auto-login: the studio accepts a Mini App opened from ANY of these bots
      # (the new TeleScripts bot first, the old login bot too), so a stale token never locks people out
      - STUDIO_TELEGRAM_BOT_TOKEN=${DUBBER_BOT_TOKEN:-},${TELEGRAM_LOGIN_BOT_TOKEN:-}
      - STUDIO_BOT_USERNAME=${DUBBER_BOT_USERNAME:-}
      # Voice cloning runs in the voxcpm container below (private network only).
      # VOXCPM_URL in .env can point at the Colab GPU notebook instead (faster).
      - VOXCPM_API_URL=${VOXCPM_URL:-http://voxcpm:8000}
      - VOXCPM_API_KEY=${VOXCPM_API_KEY:-}
    volumes:
      - studio_data:/app/data
      - studio_uploads:/app/uploads
      - studio_outputs:/app/outputs
      - studio_samples:/app/samples
    expose:
      - "3000"
    # No depends_on on voxcpm: `up -d studio` must not restart the CPU VoxCPM2 when the studio
    # uses a Colab GPU (VOXCPM_URL). Without VoxCPM2 the studio falls back to the plain Khmer voice.

  # VoxCPM2 2.0.3 voice cloning on the VPS CPU, with the Khmer voice bank.
  # First start downloads the model (~5 GB) into voxcpm_models; it needs ~8 GB RAM.
  voxcpm:
    build:
      context: https://github.com/saveitkh/BarameyDabber.git#${STUDIO_GIT_REF:-claude/admiring-curie-90hbte}:voxcpm_server
    container_name: voxcpm2
    restart: unless-stopped
    environment:
      - VOXCPM_API_KEY=${VOXCPM_API_KEY:-}
      # More diffusion steps = cleaner voice but slower on a CPU (default 10)
      - VOXCPM_TIMESTEPS=${VOXCPM_TIMESTEPS:-10}
    volumes:
      - voxcpm_models:/models
      - voxcpm_voices:/data
    expose:
      - "8000"

  # The bot/userbot service from this repo. Opt-in (--profile bot): run it here only if
  # it is NOT also running on Railway -- two copies of the userbot fight over the
  # Telegram session and the webhook.
  bot:
    profiles: ["bot"]
    build: .
    container_name: saveit-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - PUBLIC_URL=https://${BOT_HOST:-bot.localhost}
      - DUBBING_STUDIO_URL=https://${STUDIO_HOST:?Set STUDIO_HOST}/
    expose:
      - "8000"

  # The small "Khmer Dubber" bot (its own BotFather token): /start -> button that opens the
  # Mini App. Long polling, so it needs no public URL and never clashes with the other bot.
  dubber-bot:
    build: .
    container_name: dubber-bot
    restart: unless-stopped
    command: ["node", "src/dubberBot.js"]
    environment:
      - DUBBER_BOT_TOKEN=${DUBBER_BOT_TOKEN:-}
      - DUBBING_STUDIO_URL=https://${STUDIO_HOST:?Set STUDIO_HOST}/
      - DUBBER_SUPPORT_URL=${DUBBER_SUPPORT_URL:-}
      # The KH Invoice web app (business management) opened as a Mini App from the bot's menu
      - DUBBER_BUSINESS_URL=${DUBBER_BUSINESS_URL:-}
    volumes:
      - dubber_bot_data:/srv/data
    profiles: ["dubber-bot"]

  caddy:
    image: caddy:2
    container_name: vps-https
    restart: unless-stopped
    depends_on:
      - studio
    ports:
      - "80:80"
      - "443:443"
    environment:
      - STUDIO_HOST=${STUDIO_HOST:?Set STUDIO_HOST, e.g. dub.184-174-38-113.sslip.io}
      - BOT_HOST=${BOT_HOST:-bot.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  studio_data:
  studio_uploads:
  studio_outputs:
  studio_samples:
  voxcpm_models:
  voxcpm_voices:
  dubber_bot_data:
  caddy_data:
  caddy_config:
